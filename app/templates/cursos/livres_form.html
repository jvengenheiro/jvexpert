{% extends "base.html" %}
{% block title %}{{ "Editar" if curso else "Novo" }} curso livre{% endblock %}
{% block content %}
<h1 class="h3 mb-3">{{ "Editar" if curso else "Novo" }} curso livre</h1>

<div class="card p-4" style="max-width: 640px;">
  <form method="post">
    <div class="row">
      <div class="col-md-8 mb-3">
        <label class="form-label">Nome do curso *</label>
        <input type="text" class="form-control" name="nome" value="{{ curso.nome if curso else '' }}" required>
      </div>
      <div class="col-md-4 mb-3">
        <label class="form-label">Categoria *</label>
        <input type="text" class="form-control" name="categoria" value="{{ curso.categoria if curso else '' }}"
               placeholder="deve bater com a qualificação do instrutor" required>
      </div>
    </div>

    <div class="row">
      <div class="col-md-4 mb-3">
        <label class="form-label">Data *</label>
        <input type="date" class="form-control" name="data" value="{{ curso.data if curso else '' }}" required>
      </div>
      <div class="col-md-4 mb-3">
        <label class="form-label">Hora início *</label>
        <input type="time" class="form-control" name="hora_inicio" value="{{ curso.hora_inicio.strftime('%H:%M') if curso else '' }}" required>
      </div>
      <div class="col-md-4 mb-3">
        <label class="form-label">Hora fim *</label>
        <input type="time" class="form-control" name="hora_fim" value="{{ curso.hora_fim.strftime('%H:%M') if curso else '' }}" required>
      </div>
    </div>

    <div class="row">
      <div class="col-md-6 mb-3">
        <label class="form-label">Carga horária (h)</label>
        <input type="number" min="1" class="form-control" name="carga_horaria" value="{{ curso.carga_horaria if curso and curso.carga_horaria else '' }}">
      </div>
      <div class="col-md-6 mb-3">
        <label class="form-label">Vagas</label>
        <input type="number" min="1" class="form-control" name="vagas" value="{{ curso.vagas if curso and curso.vagas else '' }}">
      </div>
    </div>

    <button type="submit" class="btn btn-primary">Salvar</button>
    <a href="{{ url_for('cursos.listar_livres') }}" class="btn btn-link">Cancelar</a>
  </form>
</div>
{% endblock %}
